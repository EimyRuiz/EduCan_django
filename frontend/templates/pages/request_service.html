{% extends 'layouts/base.html' %}
{% block title %}Solicitar servicio | EDUCAN{% endblock %}

{% block content %}
<section class="page-header">
    <div class="page-header-overlay"></div>
    <div class="container position-relative text-center text-white py-5">
        <p class="text-uppercase fw-bold small mb-2" style="letter-spacing: 2px;">Agenda tu sesión</p>
        <h1 class="fw-bold display-5">Solicitar un servicio</h1>
    </div>
</section>

<section class="py-5 my-4">
    <div class="container" style="max-width: 800px;">

        <div id="noAuthMsg" class="alert alert-warning d-none">
            Debes iniciar sesión como cliente para solicitar un servicio.
        </div>

        <div id="requestFormWrapper" class="d-none">
            <div id="requestError" class="alert alert-danger d-none"></div>
            <div id="requestSuccess" class="alert alert-success d-none"></div>

            <form id="requestForm">
                <div class="admin-card mb-4">
                    <h6 class="fw-bold mb-3">Datos del servicio</h6>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">¿Qué servicio necesitas?</label>
                            <select class="form-select" id="reqServicio" required>
                                <option value="" disabled selected>Selecciona un servicio</option>
                                <option value="Adiestramiento básico">Adiestramiento básico</option>
                                <option value="Cachorros y socialización">Cachorros y socialización</option>
                                <option value="Modificación de conducta">Modificación de conducta</option>
                                <option value="Ansiedad por separación">Ansiedad por separación</option>
                                <option value="Entrenamiento avanzado">Entrenamiento avanzado</option>
                                <option value="Agility y deportes caninos">Agility y deportes caninos</option>
                                <option value="Paseos y ejercicio">Paseos y ejercicio</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Duración estimada</label>
                            <select class="form-select" id="reqDuracion" required>
                                <option value="" disabled selected>Selecciona una duración</option>
                                <option value="corto">Corto plazo (menos de 1 mes)</option>
                                <option value="mediano">Mediano plazo (1 a 6 meses)</option>
                                <option value="largo">Largo plazo (6 meses a 1 año)</option>
                                <option value="muy_largo">Muy largo plazo (más de 1 año)</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Fecha en que te gustaría iniciar</label>
                            <input type="date" class="form-control" id="reqFecha" required>
                        </div>
                    </div>
                </div>

                <div class="admin-card mb-4">
                    <h6 class="fw-bold mb-3">Datos de tu perro</h6>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Nombre del perro</label>
                            <input type="text" class="form-control" id="reqPerroNombre" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Raza</label>
                            <input type="text" class="form-control" id="reqPerroRaza" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold">Edad (años)</label>
                            <input type="number" min="0" class="form-control" id="reqPerroEdad" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold">Peso (kg)</label>
                            <input type="number" step="0.1" min="0" class="form-control" id="reqPerroPeso" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold">Sexo</label>
                            <select class="form-select" id="reqPerroSexo" required>
                                <option value="" disabled selected>Selecciona</option>
                                <option value="macho">Macho</option>
                                <option value="hembra">Hembra</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">¿Está esterilizado?</label>
                            <select class="form-select" id="reqPerroEsterilizado" required>
                                <option value="" disabled selected>Selecciona</option>
                                <option value="true">Sí</option>
                                <option value="false">No</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">¿Vacunas al día?</label>
                            <select class="form-select" id="reqPerroVacunas" required>
                                <option value="" disabled selected>Selecciona</option>
                                <option value="true">Sí</option>
                                <option value="false">No</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-bold">Conducta y traumas (si aplica)</label>
                            <textarea class="form-control" id="reqPerroConducta" rows="3" placeholder="Ej: le tiene miedo a los ruidos fuertes, fue atacado por otro perro pequeño y ahora reacciona con miedo, etc."></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-bold">Salud y condiciones médicas (si aplica)</label>
                            <textarea class="form-control" id="reqPerroSalud" rows="2" placeholder="Ej: soplo en el corazón, alergias, etc."></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-bold">Foto del perro (opcional)</label>
                            <input type="file" class="form-control" id="reqPerroFoto" accept="image/*">
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-olive btn-lg w-100 rounded-pill">Enviar solicitud</button>
            </form>
        </div>

        <div class="mt-5">
            <h5 class="fw-bold mb-3">Mis solicitudes</h5>
            <div id="misSolicitudes"></div>
        </div>

    </div>
</section>
{% endblock %}
